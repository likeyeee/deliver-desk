[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boss-job-cli"
version = "0.6.1"
description = "通过可见浏览器操作 BOSS 直聘的本地求职工作台与 CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.49,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
  "filelock>=3.16,<4",
  "platformdirs>=4.3,<5",
  "pypdf>=6,<7",
]

[project.urls]
Homepage = "https://github.com/likeyeee/deliver-desk"
Repository = "https://github.com/likeyeee/deliver-desk"
Issues = "https://github.com/likeyeee/deliver-desk/issues"

[project.scripts]
boss = "boss_cli.cli:app"

[dependency-groups]
dev = [
    "pyinstaller>=6.12,<7",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/boss_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
