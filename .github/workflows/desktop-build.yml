name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: npm ci --no-audit --no-fund
      - run: uv run pytest tests/test_config_matching.py tests/test_storage_runner.py tests/test_desktop_service.py -q
      - run: npm run build:ui
      - run: npm run test:desktop
      - run: npm run test:ui
      - run: npm run build:backend
      - run: npm run test:desktop -- --packaged-backend
      - if: runner.os == 'macOS'
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - run: uv run python scripts/package_checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DeliverDesk-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
