name: 问题反馈
description: 复现一个错误或异常行为
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 应用版本与系统
      placeholder: 0.3.0 / macOS arm64 或 Windows x64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 写出操作顺序、期望结果和实际结果。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 请移除姓名、聊天内容、二维码、Cookie 和本机个人路径。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 已搜索现有 Issue，附件中没有账号或个人数据。
          required: true
